        (s.tri&&!s.done?'<span class="tri">△</span>':'')+
        (s.n>0&&!s.done?'<span class="streak">'+s.n+'/2</span>':'')+
        (isOpen?'<div class="ans">'+it[1]+'</div><div class="btns"><button class="ok">言えた</button><button class="ng">△ 言えなかった</button></div>':'<div class="mask">？？？</div>')+
        '</div>';
      const cell=row.querySelector(".cell");
      if(!s.done){
        const m=cell.querySelector(".mask");if(m)m.addEventListener("click",()=>{open[it.id]=true;render()});
        const ok=cell.querySelector(".ok");if(ok)ok.addEventListener("click",e=>{e.stopPropagation();const t=stOf(it.id);t.n++;t.tri=false;if(t.n>=2)t.done=true;st[it.id]=t;open[it.id]=false;save();render()});
        const ng=cell.querySelector(".ng");if(ng)ng.addEventListener("click",e=>{e.stopPropagation();const t=stOf(it.id);t.n=0;t.tri=true;st[it.id]=t;open[it.id]=false;save();render()});
      }
      rows.appendChild(row);
    });
    if(shown===0){const e=document.createElement("div");e.className="empty";e.textContent=triOnly?"△はありません":"この見出しは卒業です";rows.appendChild(e)}
    wrap.appendChild(rows);root.appendChild(wrap);
  });
  document.getElementById("left").textContent="残り "+remainAll+"／"+totalAll;
  document.getElementById("grad").style.display=remainAll===0?"block":"none";
  const bt=document.getElementById("bTri");bt.textContent=triOnly?"全部見る":"△だけ見る";bt.className=triOnly?"on":"";
  const bd=document.getElementById("bDone");bd.textContent=showDone?"済を隠す":"済も見る";bd.className=showDone?"on":"";
}
document.getElementById("bHide").onclick=()=>{open={};render()};
document.getElementById("bTri").onclick=()=>{triOnly=!triOnly;open={};render()};
document.getElementById("bShuf").onclick=()=>{shuffleAll();render()};
document.getElementById("bDone").onclick=()=>{showDone=!showDone;render()};
document.getElementById("bReset").onclick=()=>{if(confirm("全部のマスを最初に戻しますか？")){st={};open={};triOnly=false;save();render()}};
document.getElementById("toTop").onclick=e=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})};
load();shuffleAll();render();
</script>
</body>
</html>
