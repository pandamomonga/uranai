<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消える表　期限1　年の仲間</title>
<style>
  :root{--bg:#15191a;--fg:#e8e6e0;--term:#7ee0b8;--yel:#FFE066;--ok:#4ade80;--ng:#ff7a6b;--card:#1f2426;--line:#343b3e;--green:#0c6b56;--navy:#1f5aa6;--brown:#b5742a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:17px;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:12px 14px 60px}
  h1{font-size:20px;margin:6px 0 8px;color:var(--yel)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .btn{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer;user-select:none}
  .btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
  .cnt{margin-left:auto;font-size:15px;color:var(--yel);font-weight:700}
  .svc{background:#111516;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .svc h2{margin:0;padding:8px 12px;font-size:17px;color:#fff;background:var(--navy)}
  .row{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
  .lab{padding:8px 12px 2px;font-size:15px;color:var(--term)}
  .cell{padding:6px 12px 10px;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none}
  .cell .q{color:var(--yel);font-weight:700;font-size:18px;letter-spacing:2px}
  .cell .mark{font-size:13px;color:#9ab;white-space:nowrap}
  .cell .mark.tri{color:var(--ng);font-weight:700}
  .cell .mark.dot{color:var(--ok)}
  .cell.open{background:#1c2a24;flex-direction:column;align-items:stretch;cursor:default}
  .cell.open .ans{font-size:17px;color:var(--fg);font-weight:600}
  .judge{display:flex;gap:8px;margin-top:8px}
  .judge .btn{flex:1;text-align:center;font-size:16px;padding:10px}
  .judge .ok{background:var(--green);border-color:var(--green);color:#fff}
  .judge .ng{background:var(--brown);border-color:var(--brown);color:#fff}
  .row.gone .cell{color:#556;font-size:13px;min-height:30px;padding:2px 12px 8px;cursor:default}
  .row.gone .lab{color:#556;font-size:13px}
  .row.hide{display:none}
  .koe{margin-top:14px;font-size:14px;color:var(--yel);background:#20282b;padding:10px 12px;border-radius:8px}
  .foot{margin-top:12px;font-size:13px;color:#8a9}
  .done{margin:10px 0;padding:12px;border-radius:10px;background:#173125;color:var(--ok);font-weight:700;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>消える表　期限1　年の仲間</h1>
  <div class="bar">
    <span class="btn navy" id="hideAll">全部隠す</span>
    <span class="btn" id="triOnly">△だけ見る</span>
    <span class="btn" id="resetAll">全部戻す</span>
    <span class="cnt" id="cnt"></span>
  </div>
  <div id="doneMsg" class="done" style="display:none">残り0マス。この表は卒業です。声出しの1行だけ残してください。</div>
  <div id="board"></div>
  <div class="koe">声出し：時効と保存は2年、計画と保険料は3年、資格は5年、指定は6年。滞納は1年で償還・1年半で差止・2年で7割</div>
  <div class="foot">問いを読んで口で答える→タップして開ける→「言えた」か「△」。2回続けて「言えた」のマスは消える。開くたびに前回の続きから。</div>
</div>
<script>
const DATA=[{"s": "時効（2年）", "items": [["市町村が保険料を集める権利は、何年で消えるか", "2年"], ["保険料の還付を受ける権利は、何年で消えるか", "2年"], ["保険給付を受ける権利（償還払いの請求）は、何年で消えるか", "2年（10年・5年ではない）"], ["事業者の介護報酬の請求権（法定代理受領）は、何年で消えるか", "2年"], ["督促をすると、時効はどうなるか", "更新される（振り出しに戻る）"], ["介護保険審査会への審査請求は、時効の上で何とみなされるか", "裁判上の請求"], ["未納が時効で消えた期間がある人の給付は、どうなるか", "9割→7割に減る（3割負担の人は6割）。高額介護サービス費も出ない"]]}, {"s": "2年（時効以外）", "items": [["事業者の記録の保存期間は", "完結の日から2年"], ["介護認定審査会の委員の任期は", "2年（再任できる）"]]}, {"s": "3年", "items": [["介護保険事業計画（市町村・都道府県）は、何年を1期とするか", "3年"], ["第1号保険料率は、何年を通じて財政を均衡させるか", "3年（5年ではない）"], ["第1号・第2号の按分割合は、何年ごとに見直すか", "3年ごと"], ["財政安定化基金の貸付は、いつ返すか", "次の計画期間（3年）で分けて返す"], ["介護保険審査会の委員の任期は", "3年"]]}, {"s": "5年", "items": [["介護支援専門員証の有効期間は", "5年（更新研修を受ける）"], ["登録を消除された介護支援専門員は、何年間は再登録できないか", "5年"], ["指定を取り消された事業者は、何年間は指定を受けられないか", "5年"]]}, {"s": "6年", "items": [["事業者・施設の指定の更新は、何年ごとか", "6年（5年ではない）"]]}, {"s": "滞納のペナルティ", "items": [["第1号保険料を1年以上滞納すると、どうなるか", "償還払いになる（いったん10割払う）"], ["1年6月以上滞納すると、どうなるか", "給付の一時差し止め"], ["2年（時効で消滅）になると、どうなるか", "給付が7割に減る"], ["第2号被保険者が医療保険料を滞納すると、どうなるか", "給付の一時差し止め"]]}];
const KEY="kieru_kigen1_v1";
let st={};
function load(){ try{ const x=localStorage.getItem(KEY); if(x) st=JSON.parse(x);}catch(e){ st={}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
function get(k){ return st[k]||(st[k]={k:0,t:false,g:false}); }
let open={}; let triOnly=false; let total=0;
DATA.forEach(d=>{ total+=d.items.length; });
function render(){
  const b=document.getElementById('board'); b.innerHTML="";
  let remain=0;
  DATA.forEach((d,r)=>{
    const svc=document.createElement('div'); svc.className='svc';
    svc.innerHTML=`<h2>${d.s}</h2>`;
    d.items.forEach((it,c)=>{
      const [q,a]=it; const key=`${r}_${c}`; const s=get(key);
      const row=document.createElement('div'); row.className='row';
      if(s.g) row.classList.add('gone'); else remain++;
      if(triOnly && !s.t) row.classList.add('hide');
      const lab=`<div class="lab">${q}</div>`;
      let cell;
      if(s.g){ cell=`<div class="cell">済　${a}</div>`; }
      else if(open[key]){
        cell=`<div class="cell open"><div class="ans">${a}</div>
          <div class="judge"><span class="btn ok" data-j="ok" data-k="${key}">言えた${s.k===1?'（2回目で消える）':''}</span><span class="btn ng" data-j="ng" data-k="${key}">△ 言えなかった</span></div></div>`;
      }else{
        const mark = s.t ? `<span class="mark tri">△</span>` : (s.k===1 ? `<span class="mark dot">●1</span>` : `<span class="mark"></span>`);
        cell=`<div class="cell" data-open="${key}"><span class="q">？？？</span>${mark}</div>`;
      }
      row.innerHTML=lab+cell; svc.appendChild(row);
    });
    b.appendChild(svc);
  });
  document.getElementById('cnt').textContent=`残り ${remain}／${total}`;
  document.getElementById('doneMsg').style.display= remain===0 ? 'block':'none';
  b.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{open[el.dataset.open]=true;render();}));
  b.querySelectorAll('[data-j]').forEach(el=>el.addEventListener('click',()=>judge(el.dataset.k,el.dataset.j)));
}
function judge(key,j){
  const s=get(key);
  if(j==='ok'){ s.k+=1; s.t=false; if(s.k>=2){ s.g=true; } }
  else { s.k=0; s.t=true; }
  delete open[key]; save(); render();
}
document.getElementById('hideAll').addEventListener('click',()=>{open={};render();});
document.getElementById('triOnly').addEventListener('click',()=>{triOnly=!triOnly;document.getElementById('triOnly').textContent=triOnly?'全部見る':'△だけ見る';render();});
document.getElementById('resetAll').addEventListener('click',()=>{ if(confirm('消したマスも△も全部戻します。よいですか')){ st={}; open={}; save(); render(); } });
load(); render();
</script>
</body>
</html>
