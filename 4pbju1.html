function h(s){let x=5381;for(let i=0;i<s.length;i++){x=((x<<5)+x+s.charCodeAt(i))|0}return (x>>>0).toString(36)}
DATA.forEach(sec=>{sec.items.forEach(it=>{it.id=sec.k+"_"+h(it[0])})});
let st={},open={},triOnly=false,showDone=false,order={};
function load(){try{const v=localStorage.getItem(KEY);if(v)st=JSON.parse(v);}catch(e){st={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function shuffleAll(){DATA.forEach(sec=>{const a=sec.items.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}order[sec.k]=a;});open={};}
function stOf(id){return st[id]||{n:0,done:false,tri:false}}
function render(){
  const root=document.getElementById("root");root.innerHTML="";
  const toc=document.getElementById("toc");toc.innerHTML="";
  let remainAll=0,totalAll=0;
  DATA.forEach(sec=>{
    let remain=0,tri=0;
    sec.items.forEach(it=>{const s=stOf(it.id);if(!s.done){remain++;if(s.tri)tri++}});
    remainAll+=remain;totalAll+=sec.items.length;
    const tb=document.createElement("button");
    tb.innerHTML="<b>"+sec.t+"</b><span>残り "+remain+"／"+sec.items.length+(tri?"　△"+tri:"")+"</span>";
    tb.onclick=()=>{document.getElementById("sec_"+sec.k).scrollIntoView({behavior:"smooth",block:"start"})};
    toc.appendChild(tb);
    const wrap=document.createElement("div");wrap.className="sec "+sec.c;wrap.id="sec_"+sec.k;
    wrap.innerHTML='<h2>'+sec.t+'<span>残り '+remain+'／'+sec.items.length+'</span></h2><div class="voice">声出し：'+sec.v+'</div>';
    const rows=document.createElement("div");rows.className="rows";
    let shown=0;
    order[sec.k].forEach(idx=>{
      const it=sec.items[idx];const s=stOf(it.id);
      let hide=false;
      if(s.done&&!showDone)hide=true;
      if(triOnly&&(!s.tri||s.done))hide=true;
      if(hide)return;
      shown++;
      const row=document.createElement("div");row.className="row"+(s.done?" done":"");
      const isOpen=!!open[it.id]&&!s.done;
      row.innerHTML='<div class="q">'+it[0]+'</div><div class="cell">'+
        (s.tri&&!s.done?'<span class="tri">△</span>':'')+
        (s.n>0&&!s.done?'<span class="streak">'+s.n+'/2</span>':'')+
        (isOpen?'<div class="ans">'+it[1]+'</div><div class="btns"><button class="ok">言えた</button><button class="ng">△ 言えなかった</button></div>':'<div class="mask">？？？</div>')+
        '</div>';
      const cell=row.querySelector(".cell");
      if(!s.done){
        const m=cell.querySelector(".mask");if(m)m.addEventListener("click",()=>{open[it.id]=true;render()});
        const ok=cell.querySelector(".ok");if(ok)ok.addEventListener("click",e=>{e.stopPropagation();const t=stOf(it.id);t.n++;t.tri=false;if(t.n>=2)t.done=true;st[it.id]=t;open[it.id]=false;save();render()});
        const ng=cell.querySelector(".ng");if(ng)ng.addEventListener("click",e=>{e.stopPropagation();const t=stOf(it.id);t.n=0;t.tri=true;st[it.id]=t;open[it.id]=false;save();render()});
      }
      rows.appendChild(row);
    });
    if(shown===0){const e=document.createElement("div");e.className="empty";e.textContent=triOnly?"△はありません":"この見出しは卒業です";rows.appendChild(e)}
    wrap.appendChild(rows);root.appendChild(wrap);
  });
  document.getElementById("left").textContent="残り "+remainAll+"／"+totalAll;
  document.getElementById("grad").style.display=remainAll===0?"block":"none";
  const bt=document.getElementById("bTri");bt.textContent=triOnly?"全部見る":"△だけ見る";bt.className=triOnly?"on":"";
  const bd=document.getElementById("bDone");bd.textContent=showDone?"済を隠す":"済も見る";bd.className=showDone?"on":"";
}
document.getElementById("bHide").onclick=()=>{open={};render()};
document.getElementById("bTri").onclick=()=>{triOnly=!triOnly;open={};render()};
document.getElementById("bShuf").onclick=()=>{shuffleAll();render()};
document.getElementById("bDone").onclick=()=>{showDone=!showDone;render()};
document.getElementById("bReset").onclick=()=>{if(confirm("全部のマスを最初に戻しますか？")){st={};open={};triOnly=false;save();render()}};
document.getElementById("toTop").onclick=e=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})};
load();shuffleAll();render();
</script>
