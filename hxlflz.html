<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一陸特 法規ノック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 一枚のカードを打ち返す。上に残り数、下に答えるボタン。 */
:root{
  --paper:#f3f5f4; --card:#ffffff; --ink:#16242b; --sub:#5d6c72;
  --line:#d5dcdb; --accent:#0d6b6e; --accent-ink:#ffffff;
  --good:#1f7a45; --bad:#b3372f; --hide:#16242b;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10191d; --card:#18252b; --ink:#e8efee; --sub:#9aaaae;
    --line:#2c3d44; --accent:#4fc3bd; --accent-ink:#0b1a1c;
    --good:#6fd094; --bad:#ff8f84; --hide:#e8efee;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10191d; --card:#18252b; --ink:#e8efee; --sub:#9aaaae;
  --line:#2c3d44; --accent:#4fc3bd; --accent-ink:#0b1a1c;
  --good:#6fd094; --bad:#ff8f84; --hide:#e8efee;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-size:24px;margin:0;line-height:1.3}
.lead{color:var(--sub);font-size:14px;margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;font-variant-numeric:tabular-nums}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.stats b{font-size:17px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.tag{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.q{font-size:19px;font-weight:700;line-height:1.65;margin:0}
.q .gap{border-bottom:2px solid var(--accent);padding:0 14px;margin:0 2px}
.hint{font-size:13px;color:var(--sub);margin:0}
.ans{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.ans.row{flex-direction:row}
.ans button{font:inherit;font-size:17px;line-height:1.5;padding:14px 12px;border-radius:8px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left;flex:1}
.ans.row button{text-align:center;font-size:30px;font-weight:700;padding:14px 0}
.ans button.right{border-color:var(--good);color:var(--good);font-weight:700}
.ans button.wrong{border-color:var(--bad);color:var(--bad)}
.ans button:disabled{cursor:default;opacity:1}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.blank{background:var(--hide);color:transparent;border-radius:4px;padding:1px 6px;margin:0 2px;cursor:pointer;user-select:none}
.blank.open{background:transparent;color:var(--good);border-bottom:2px solid var(--good);border-radius:0}
.verdict{font-weight:700;font-size:18px;margin:0}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.ex{margin:0;font-size:16px}
.next{font:inherit;font-size:17px;font-weight:700;padding:14px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--sub)}
.foot button{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:6px 10px;cursor:pointer}
</style>
</head>

<main>

    <h1>一陸特 法規ノック</h1>

  <div class="modes" id="modes">

    <button type="button" data-m="k">穴埋め</button>
    <button type="button" data-m="weak">苦手だけ</button>

  <section class="card" id="card"></section>
  <div class="foot">
    <span id="total"></span>
    <button type="button" id="reset">最初からやり直す</button>
  </div>
</main>

var KEY="ichirikutoku-hoki-v1";
var S={r:1,q:[],w:{},m:"all",n:0};
var store=null;
try{store=window.localStorage;var raw=store.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.len===D.length){S=o.s;}}}catch(e){store=null;}
function save(){if(!store)return;try{store.setItem(KEY,JSON.stringify({len:D.length,s:S}));}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pool(){var ids=[];for(var i=0;i<D.length;i++){if(S.m==="all"||D[i][0]===S.m||(S.m==="weak"&&S.w[i]>0))ids.push(i);}return ids;}
function deal(){S.q=shuffle(pool());S.n=S.q.length;}
function weakCount(){var c=0;for(var k in S.w){if(S.w[k]>0)c++;}return c;}
function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function stats(){
  $("sRound").textContent=S.r;$("sLeft").textContent=S.q.length;$("sWeak").textContent=weakCount();
  var done=S.n?Math.max(0,S.n-S.q.length)/S.n*100:0;$("bar").style.width=done+"%";
  var bs=$("modes").querySelectorAll("button");
  for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed",bs[i].getAttribute("data-m")===S.m?"true":"false");
}
function right(id){S.q.shift();if(S.w[id]>0)S.w[id]--;}
function miss(id){S.q.shift();S.w[id]=(S.w[id]||0)+2;S.q.splice(Math.min(4,S.q.length),0,id);}
function nextBtn(card){var b=el("button","next","次へ");b.type="button";b.onclick=function(){save();show();};card.appendChild(b);b.focus();}

function show(){
  var card=$("card");card.textContent="";
  if(!S.q.length){
    if(S.m==="weak"&&!pool().length){
      card.appendChild(el("p","q","苦手な問題はありません。"));
      card.appendChild(el("p","ex","間違えた問題がここにたまります。「全部」に戻って続けてください。"));
      stats();return;
    }
    card.appendChild(el("p","tag","ここまで終わり"));
    card.appendChild(el("p","q",S.r+"周目が終わりました。"));
    card.appendChild(el("p","ex","苦手は "+weakCount()+" 問です。もう1周すると、順番が入れ替わって出てきます。"));
    var b=el("button","next","次の周を始める");b.type="button";
    b.onclick=function(){S.r++;deal();save();show();};card.appendChild(b);stats();return;
  }
  var id=S.q[0],d=D[id];
  card.appendChild(el("p","tag",d[1]+"の話"));
  if(d[0]==="k")cloze(card,id,d);else choice(card,id,d);
  stats();
}
function choice(card,id,d){
  var q=el("p","q");
  var parts=d[2].split("＿＿");
  for(var i=0;i<parts.length;i++){q.appendChild(document.createTextNode(parts[i]));if(i<parts.length-1)q.appendChild(el("span","gap","？"));}
  card.appendChild(q);
  var isOX=d[0]==="o";
  var opts=isOX?[["○",d[3]===1],["×",d[3]===0]]:shuffle([[d[3],true],[d[4],false]]);
  var box=el("div","ans"+(isOX?" row":""));var btns=[];
  opts.forEach(function(o){
    var b=el("button","",o[0]);b.type="button";btns.push([b,o[1]]);
    b.onclick=function(){
      btns.forEach(function(x){x[0].disabled=true;if(x[1])x[0].className="right";});
      if(o[1]){right(id);}else{b.className="wrong";miss(id);}
      var v=el("p","verdict "+(o[1]?"ok":"ng"),o[1]?"正解":"ちがいます");
      card.appendChild(v);
      var ex=isOX?d[4]:d[5];
      if(isOX&&!ex)ex="このとおりです。";
      card.appendChild(el("p","ex",ex));
      nextBtn(card);stats();
    };
    box.appendChild(b);
  });
  card.appendChild(box);
}
function cloze(card,id,d){
  var q=el("p","q");
  var re=/\[\[(.+?)\]\]/g,last=0,m;
  while((m=re.exec(d[2]))){
    q.appendChild(document.createTextNode(d[2].slice(last,m.index)));
    var s=el("span","blank",m[1]);s.setAttribute("role","button");s.tabIndex=0;
    s.onclick=function(){this.classList.toggle("open");};
    s.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();this.classList.toggle("open");}};
    q.appendChild(s);last=re.lastIndex;
  }
  q.appendChild(document.createTextNode(d[2].slice(last)));
  card.appendChild(q);
  card.appendChild(el("p","hint","黒いところを頭の中で言ってから押す。もう一度押すと隠れます。"));
  var box=el("div","ans row");
  var a=el("button","","言えた");a.type="button";a.style.fontSize="18px";
  var b=el("button","","まだ");b.type="button";b.style.fontSize="18px";
  a.onclick=function(){right(id);save();show();};
  b.onclick=function(){miss(id);save();show();};
  box.appendChild(a);box.appendChild(b);card.appendChild(box);
}

$("modes").onclick=function(e){
  var m=e.target.getAttribute&&e.target.getAttribute("data-m");if(!m)return;
  S.m=m;deal();save();show();
};
var armed=false;
$("reset").onclick=function(){
  if(!armed){armed=true;this.textContent="もう一度押すと記録を消します";var t=this;setTimeout(function(){armed=false;t.textContent="最初からやり直す";},4000);return;}
  armed=false;this.textContent="最初からやり直す";S={r:1,q:[],w:{},m:"all",n:0};deal();save();show();
};
$("total").textContent="全 "+D.length+" 問";
if(!S.q.length&&S.r===1&&!S.n)deal();
show();
</script>
