<style>
*{box-sizing:border-box}
html,body{margin:0;background:#15191a;color:#e8e6e0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:17px;line-height:1.6}
header{padding:18px 16px 8px}

.row{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid #2a3032}
.q{color:#7ee0b8;font-weight:700}
.src{display:block;color:#8f958f;font-size:13px;font-weight:400;margin-top:2px}
.ans{grid-column:1/2;justify-self:start;background:#FFE066;color:#000;border:0;border-radius:6px;padding:9px 14px;font-size:17px;font-weight:700;cursor:pointer;text-align:left;min-width:96px}
.ans.hide{letter-spacing:.2em}
.mark{grid-row:1/3;grid-column:2/3;background:#2a3032;color:#e8e6e0;border:1px solid #3c4446;border-radius:6px;padding:10px 10px;font-size:14px;cursor:pointer;white-space:nowrap}
.mark.on{background:#ff7a6b;color:#000;border-color:#ff7a6b;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0f1213;border-top:1px solid #2a3032;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:center;z-index:6}
.bar button{background:#FFE066;color:#000;border:0;border-radius:6px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.bar button.sub{background:#2a3032;color:#e8e6e0;border:1px solid #3c4446}
.bar span{font-size:14px;color:#b9b6ad}
.none{padding:24px 4px;color:#b9b6ad}
</style>
</head>

var cur=0,only=false,open={},weak={};
var tabs=document.getElementById("tabs"),main=document.getElementById("main"),count=document.getElementById("count");
function key(b,i){return b+"-"+i}
function drawTabs(){
tabs.innerHTML="";
DATA.forEach(function(d,b){
var t=document.createElement("button");t.type="button";t.className="c"+(b%3)+(b===cur&&!only?" on":"");t.textContent=d.name;
t.onclick=function(){cur=b;only=false;draw();window.scrollTo(0,0)};tabs.appendChild(t);
});
}
function rowEl(b,i){
var r=DATA[b].rows[i],k=key(b,i);
var row=document.createElement("div");row.className="row";
var q=document.createElement("div");q.className="q";q.textContent=r[0];
if(r[2]){var s=document.createElement("span");s.className="src";s.textContent="（"+r[2]+"）";q.appendChild(s)}
var a=document.createElement("button");a.type="button";
function paint(){a.className="ans"+(open[k]?"":" hide");a.textContent=open[k]?r[1]:"？？？";a.setAttribute("aria-label",open[k]?"答えを隠す":"答えを開く")}
a.onclick=function(){open[k]=!open[k];paint()};paint();
var m=document.createElement("button");m.type="button";
function paintM(){m.className="mark"+(weak[k]?" on":"");m.textContent=weak[k]?"△ついてる":"△まだ怪しい"}
m.onclick=function(){weak[k]=!weak[k];paintM();tally();if(only&&!weak[k]){draw()}};paintM();
row.appendChild(q);row.appendChild(m);row.appendChild(a);
return row;
}
function blockEl(b,filter){
var d=DATA[b],frag=document.createDocumentFragment();
var idx=[];d.rows.forEach(function(_,i){if(!filter||weak[key(b,i)])idx.push(i)});
if(!idx.length)return frag;
var band=document.createElement("div");band.className="band c"+(b%3);band.textContent=d.name;frag.appendChild(band);
var lead=document.createElement("p");lead.className="lead";lead.textContent=d.lead;frag.appendChild(lead);
var tools=document.createElement("div");tools.className="tools";
var h=document.createElement("button");h.type="button";h.textContent="全部隠す";
h.onclick=function(){idx.forEach(function(i){open[key(b,i)]=false});draw()};
var o=document.createElement("button");o.type="button";o.textContent="全部開く";
o.onclick=function(){idx.forEach(function(i){open[key(b,i)]=true});draw()};
tools.appendChild(h);tools.appendChild(o);frag.appendChild(tools);
idx.forEach(function(i){frag.appendChild(rowEl(b,i))});
return frag;
}
function tally(){
var n=0;for(var k in weak){if(weak[k])n++}
count.textContent="△ "+n+"行";
}
function draw(){
drawTabs();main.innerHTML="";
if(only){
var any=false;
DATA.forEach(function(_,b){var f=blockEl(b,true);if(f.childNodes.length){any=true;main.appendChild(f)}});
if(!any){var p=document.createElement("p");p.className="none";p.textContent="△の付いた行はありません。上のタブから選んでください。";main.appendChild(p)}
}else{main.appendChild(blockEl(cur,false))}
document.getElementById("onlyBtn").textContent=only?"全部の行に戻る":"△だけ見る";
tally();
}
document.getElementById("onlyBtn").onclick=function(){only=!only;draw();window.scrollTo(0,0)};
document.getElementById("clearBtn").onclick=function(){weak={};draw()};
draw();
</script>
</body>
</html>
