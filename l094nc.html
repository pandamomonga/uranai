<style>

  h1{font-size:22px;margin:0}
  .how{font-size:15px;opacity:.8;margin-top:4px}

  .bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0}
  .count{display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:6px}
  .count b{font-size:20px;color:var(--ok)}
  .count .tri{color:var(--ng);font-weight:700}
  .btnrow{display:flex;gap:8px}
  .btnrow button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text)}
  .btnrow button.on{background:var(--ng);color:#1a0d0b;border-color:var(--ng)}
  .btnrow button.warn{background:var(--ng);color:#1a0d0b;border-color:var(--ng)}

  .toc{margin:14px 0 6px;background:var(--card);border-radius:12px;padding:6px 0}
  .toc a{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--line);font-size:16px}
  .toc a:last-child{border-bottom:0}
  .toc .num{white-space:nowrap;font-size:14px;opacity:.9}
  .toc .num .t{color:var(--ng);font-weight:700}
  .toc .grad{color:var(--ok);font-weight:700}

  section{margin-top:26px}
  .sh{position:sticky;top:92px;z-index:10;color:#fff;font-weight:700;font-size:18px;padding:10px 14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sh .left{font-size:14px;font-weight:400;white-space:nowrap;opacity:.95}
  .c0{background:var(--navy)} .c1{background:var(--brown)} .c2{background:var(--green)}

  .item{display:flex;gap:10px;background:var(--card);border-radius:12px;margin:12px 0;padding:14px 12px;border:2px solid transparent;transition:opacity .2s}
  .mark{flex:0 0 40px;font-size:44px;line-height:1;color:transparent;font-weight:900;text-align:center;padding-top:0}
  .item.tri{border-color:var(--ng)}
  .item.tri .mark{color:var(--ng)}
  .item.done{opacity:.28;filter:grayscale(1)}
  .body{flex:1;min-width:0}
  .q{font-size:18px;word-break:break-word}
  .ask{margin-top:10px;width:100%;font:inherit;font-size:20px;font-weight:900;letter-spacing:.2em;padding:10px;border:0;border-radius:10px;background:var(--yellow);color:#111}
  .rev{display:none;margin-top:10px}
  .item.open .rev{display:block}
  .item.open .ask{display:none}
  .a{font-size:21px;font-weight:700;color:var(--term);word-break:break-word}
  .n{font-size:15px;opacity:.85;margin-top:4px;word-break:break-word}
  .jb{display:flex;gap:10px;margin-top:12px}
  .jb button{flex:1;font:inherit;font-size:18px;font-weight:900;padding:11px 4px;border:0;border-radius:10px}
  .jb .yes{background:var(--ok);color:#0c2414}
  .jb .no{background:var(--ng);color:#2a0f0b}
  .voice{margin:14px 0 0;background:var(--green);color:#fff;border-radius:10px;padding:12px 14px;font-weight:700;font-size:17px}
  .voice small{display:block;font-weight:400;font-size:13px;opacity:.85}
  .hidden{display:none !important}
  .grad-note{display:none;color:var(--ok);font-weight:700;margin:10px 2px 0;font-size:16px}
  section.graduated .grad-note{display:block}
</style>
</head>

</div>

var KEY = "kieru_1003_v1";
var state = {};
function load(){ try{ var s = window.localStorage.getItem(KEY); if(s){ state = JSON.parse(s) || {}; } }catch(e){ state = {}; } }
function save(){ try{ window.localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

var triOnly = false;
var COLORS = ["c0","c1","c2"];

function build(){
  var main = document.getElementById("main");
  main.innerHTML = "";
  DATA.forEach(function(sec, si){
    var s = document.createElement("section");
    s.id = "sec" + si;
    var sh = document.createElement("div");
    sh.className = "sh " + COLORS[si % 3];
    sh.innerHTML = '<span>' + (si+1) + '　' + sec.h + '</span><span class="left" id="sl' + si + '"></span>';
    s.appendChild(sh);
    var items = shuffle(sec.items.slice());
    items.forEach(function(it){
      var q = it[0], a = it[1], n = it[2];
      var d = document.createElement("div");
      d.className = "item";
      d.setAttribute("data-q", q);
      d.innerHTML =
        '<div class="mark">△</div>' +
        '<div class="body">' +
          '<div class="q"></div>' +
          '<button class="ask" type="button">？？？</button>' +
          '<div class="rev"><div class="a"></div>' + (n ? '<div class="n"></div>' : '') +
            '<div class="jb"><button class="yes" type="button">はい</button><button class="no" type="button">△</button></div>' +
          '</div>' +
        '</div>';
      d.querySelector(".q").textContent = q;
      d.querySelector(".a").textContent = a;
      if(n){ d.querySelector(".n").textContent = n; }
      var st = state[q];
      if(st === "done"){ d.classList.add("done"); }
      if(st === "tri"){ d.classList.add("tri"); }
      d.querySelector(".ask").addEventListener("click", function(){ d.classList.add("open"); });
      d.querySelector(".q").addEventListener("click", function(){
        if(d.classList.contains("done")){ d.classList.toggle("open"); }
      });
      d.querySelector(".yes").addEventListener("click", function(){
        state[q] = "done"; save();
        d.classList.remove("tri"); d.classList.add("done"); d.classList.remove("open");
        refresh();
      });
      d.querySelector(".no").addEventListener("click", function(){
        state[q] = "tri"; save();
        d.classList.remove("done"); d.classList.add("tri"); d.classList.remove("open");
        refresh();
      });
      s.appendChild(d);
    });
    var g = document.createElement("div");
    g.className = "grad-note";
    g.textContent = "この見出しは全部言えました。声出しだけ残します。";
    s.appendChild(g);
    var v = document.createElement("div");
    v.className = "voice";
    v.innerHTML = '<small>声に出して1回</small>';
    var vt = document.createElement("span");
    vt.textContent = "「" + sec.voice + "」";
    v.appendChild(vt);
    s.appendChild(v);
    main.appendChild(s);
  });
  refresh();
}

function refresh(){
  var total = 0, left = 0, tri = 0;
  var toc = document.getElementById("toc");
  toc.innerHTML = "";
  DATA.forEach(function(sec, si){
    var sl = 0, st = 0;
    sec.items.forEach(function(it){
      total++;
      var s = state[it[0]];
      if(s !== "done"){ left++; sl++; }
      if(s === "tri"){ tri++; st++; }
    });
    var el = document.getElementById("sl" + si);
    if(el){ el.textContent = "残り " + sl + "／" + sec.items.length + (st ? "　△" + st : ""); }
    var secEl = document.getElementById("sec" + si);
    if(secEl){
      if(sl === 0){ secEl.classList.add("graduated"); } else { secEl.classList.remove("graduated"); }
      if(triOnly){ if(st === 0){ secEl.classList.add("hidden"); } else { secEl.classList.remove("hidden"); } }
      else { secEl.classList.remove("hidden"); }
    }
    var a = document.createElement("a");
    a.href = "#sec" + si;
    var right = (sl === 0) ? '<span class="grad">卒業</span>' : ('残り ' + sl + (st ? '　<span class="t">△' + st + '</span>' : ''));
    a.innerHTML = '<span></span><span class="num">' + right + '</span>';
    a.firstChild.textContent = (si+1) + "　" + sec.h;
    a.addEventListener("click", function(ev){
      ev.preventDefault();
      var t = document.getElementById("sec" + si);
      if(t){ var y = t.getBoundingClientRect().top + window.pageYOffset - 96; window.scrollTo({top:y, behavior:"smooth"}); }
    });
    toc.appendChild(a);
  });
  document.getElementById("total").textContent = total;
  document.getElementById("left").textContent = left;
  document.getElementById("tricount").textContent = tri;
  var items = document.querySelectorAll(".item");
  for(var i=0;i<items.length;i++){
    var d = items[i];
    if(triOnly && !d.classList.contains("tri")){ d.classList.add("hidden"); } else { d.classList.remove("hidden"); }
  }
}

document.getElementById("hideAll").addEventListener("click", function(){
  var items = document.querySelectorAll(".item.open");
  for(var i=0;i<items.length;i++){ items[i].classList.remove("open"); }
});

document.getElementById("triOnly").addEventListener("click", function(){
  triOnly = !triOnly;
  this.textContent = triOnly ? "全部見る" : "△だけ見る";
  this.classList.toggle("on", triOnly);
  refresh();
});

var resetArmed = false, resetTimer = null;
document.getElementById("resetAll").addEventListener("click", function(){
  var b = this;
  if(!resetArmed){
    resetArmed = true;
    b.textContent = "もう一度押すと戻す";
    b.classList.add("warn");
    resetTimer = setTimeout(function(){ resetArmed = false; b.textContent = "全部戻す"; b.classList.remove("warn"); }, 4000);
    return;
  }
  clearTimeout(resetTimer);
  resetArmed = false;
  b.textContent = "全部戻す";
  b.classList.remove("warn");
  state = {}; save();
  triOnly = false;
  var t = document.getElementById("triOnly"); t.textContent = "△だけ見る"; t.classList.remove("on");
  build();
  window.scrollTo(0,0);
});

load();
build();
</script>
</body>
</html>
